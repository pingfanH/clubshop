server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    # CORS headers
    set $cors_origin $http_origin;
    set $cors_headers 'Authorization,Content-Type,X-CSRF-TOKEN,X-Requested-With,If-Match,If-Modified-Since,If-None-Match,If-Unmodified-Since,Access-Token,storeId,store-id,platform,domain';

    location / {
        # OPTIONS preflight
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Allow-Credentials true;
            add_header Access-Control-Allow-Methods 'GET, POST, PATCH, PUT, DELETE, OPTIONS';
            add_header Access-Control-Allow-Headers $cors_headers;
            add_header Access-Control-Max-Age 0;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 300;
    }

    location ~* \.(jpg|jpeg|gif|png|css|js|ico|svg|woff|woff2|ttf)$ {
        expires 7d;
        access_log off;
    }
}
